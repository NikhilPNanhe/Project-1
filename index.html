<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>School Management Portal – Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="auth-page">

  <div class="portal-title">🏫 School Management Portal</div>

  <div class="auth-card narrow">
    <div class="card-header">
      <span class="icon">🔐</span>
      <h2>Welcome Back</h2>
      <p>Sign in to your account to continue</p>
    </div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="email">Email / Username</label>
        <input type="text" id="email" placeholder="Enter your email or username" autocomplete="username" />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" />
      </div>
      <button type="submit" class="btn btn-primary btn-full" style="margin-top:6px;">Login →</button>
      <div id="msg" class="msg"></div>
    </form>

    <div class="divider">New here? Register below</div>

    <div class="register-links">
      <a href="register-teacher.html" class="btn-outline">📚 Register as Teacher</a>
      <a href="register-principal.html" class="btn-outline teal">🏛️ Register as Principal</a>
    </div>

    <p class="demo-hint">Admin login: <span>admin@school.com</span> / <span>admin123</span></p>
  </div>

  <script src="app.js"></script>
  <script>
    // Redirect if already logged in
    (function () {
      const user = getCurrentUser();
      if (user) {
        if      (user.role === 'teacher')   location.href = 'dashboard-teacher.html';
        else if (user.role === 'principal') location.href = 'dashboard-principal.html';
        else if (user.role === 'admin')     location.href = 'dashboard-admin.html';
      }
    })();

    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        showMsg('msg', 'error', 'Please fill in both fields.');
        return;
      }

      // Admin hard-coded credentials
      if (email === 'admin@school.com' && password === 'admin123') {
        setCurrentUser({ id: 'admin', name: 'Administrator', email: 'admin@school.com', role: 'admin' });
        location.href = 'dashboard-admin.html';
        return;
      }

      const users = getUsers();
      const user  = users.find(function (u) { return u.email === email && u.password === password; });

      if (!user) {
        showMsg('msg', 'error', 'Invalid email or password.');
        return;
      }
      if (user.active === false) {
        showMsg('msg', 'error', 'Your account access has been restricted by the administrator.');
        return;
      }

      setCurrentUser(user);
      if      (user.role === 'teacher')   location.href = 'dashboard-teacher.html';
      else if (user.role === 'principal') location.href = 'dashboard-principal.html';
    });
  </script>
</body>
</html>

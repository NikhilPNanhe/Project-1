<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>School Management Portal – Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        linear-gradient(rgba(10,30,60,0.65), rgba(10,30,60,0.65)),
        url('https://images.unsplash.com/photo-1580582932707-520aed937b7b?w=1920&q=80') center/cover no-repeat fixed;
    }

    .portal-title {
      position: absolute;
      top: 36px;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      font-size: clamp(1.4rem, 3vw, 2rem);
      font-weight: 700;
      letter-spacing: 1px;
      text-align: center;
      text-shadow: 0 2px 12px rgba(0,0,0,0.5);
      white-space: nowrap;
    }

    .card {
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
      padding: 44px 40px 36px;
      width: 100%;
      max-width: 420px;
      position: relative;
      z-index: 1;
    }

    .card-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .card-header .icon { font-size: 2.4rem; margin-bottom: 6px; }
    .card-header h2 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #1a237e;
    }
    .card-header p { font-size: 0.85rem; color: #6b7280; margin-top: 4px; }

    .form-group { margin-bottom: 18px; }
    .form-group label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid #d1d5db;
      border-radius: 10px;
      font-size: 0.95rem;
      font-family: inherit;
      color: #111827;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }
    .form-group input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
    }

    .btn-primary {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #1a237e 0%, #3b82f6 100%);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      margin-top: 6px;
    }
    .btn-primary:hover { opacity: 0.92; }
    .btn-primary:active { transform: scale(0.98); }

    .msg { margin-top: 12px; text-align: center; font-size: 0.86rem; border-radius: 8px; padding: 9px 14px; display: none; }
    .msg.error  { background: #fee2e2; color: #b91c1c; display: block; }
    .msg.success{ background: #dcfce7; color: #15803d; display: block; }

    .divider {
      display: flex; align-items: center; gap: 10px;
      margin: 22px 0 16px;
      color: #9ca3af; font-size: 0.8rem;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px; background: #e5e7eb;
    }

    .register-links { display: flex; gap: 10px; flex-direction: column; }
    .btn-outline {
      width: 100%;
      padding: 11px;
      background: transparent;
      border: 1.5px solid #1a237e;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      font-family: inherit;
      color: #1a237e;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      text-decoration: none;
      display: block;
      text-align: center;
    }
    .btn-outline:hover { background: #1a237e; color: #fff; }
    .btn-outline.teal { border-color: #0d9488; color: #0d9488; }
    .btn-outline.teal:hover { background: #0d9488; color: #fff; }

    .demo-hint {
      text-align: center;
      font-size: 0.76rem;
      color: #9ca3af;
      margin-top: 20px;
    }
    .demo-hint span { color: #6b7280; font-weight: 600; }

    @media (max-width: 480px) {
      .card { padding: 32px 20px 28px; margin: 16px; }
      .portal-title { font-size: 1.1rem; top: 16px; white-space: normal; text-align: center; width: 90%; }
    }
  </style>
</head>
<body>
  <div class="portal-title">🏫 School Management Portal</div>

  <div class="card">
    <div class="card-header">
      <div class="icon">🔐</div>
      <h2>Welcome Back</h2>
      <p>Sign in to your account to continue</p>
    </div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="email">Email / Username</label>
        <input type="text" id="email" placeholder="Enter your email or username" autocomplete="username" />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" />
      </div>
      <button type="submit" class="btn-primary">Login →</button>
      <div id="msg" class="msg"></div>
    </form>

    <div class="divider">New here? Register below</div>

    <div class="register-links">
      <a href="register-teacher.html" class="btn-outline">📚 Register as Teacher</a>
      <a href="register-principal.html" class="btn-outline teal">🏛️ Register as Principal</a>
    </div>

    <p class="demo-hint">Admin login: <span>admin@school.com</span> / <span>admin123</span></p>
  </div>

  <script>
    // Redirect if already logged in
    (function () {
      const u = localStorage.getItem('sms_current_user');
      if (u) {
        const user = JSON.parse(u);
        if (user.role === 'teacher')    location.href = 'dashboard-teacher.html';
        else if (user.role === 'principal') location.href = 'dashboard-principal.html';
        else if (user.role === 'admin')  location.href = 'dashboard-admin.html';
      }
    })();

    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const msgEl    = document.getElementById('msg');
      msgEl.className = 'msg';
      msgEl.textContent = '';

      if (!email || !password) {
        msgEl.className = 'msg error';
        msgEl.textContent = 'Please fill in both fields.';
        return;
      }

      // Admin check
      if (email === 'admin@school.com' && password === 'admin123') {
        const admin = { id: 'admin', name: 'Administrator', email: 'admin@school.com', role: 'admin' };
        localStorage.setItem('sms_current_user', JSON.stringify(admin));
        location.href = 'dashboard-admin.html';
        return;
      }

      const users = JSON.parse(localStorage.getItem('sms_users') || '[]');
      const user  = users.find(u => u.email === email && u.password === password);

      if (!user) {
        msgEl.className = 'msg error';
        msgEl.textContent = 'Invalid email or password.';
        return;
      }
      if (user.active === false) {
        msgEl.className = 'msg error';
        msgEl.textContent = 'Your account access has been restricted by the administrator.';
        return;
      }

      localStorage.setItem('sms_current_user', JSON.stringify(user));
      if (user.role === 'teacher')    location.href = 'dashboard-teacher.html';
      else if (user.role === 'principal') location.href = 'dashboard-principal.html';
    });
  </script>
</body>
</html>
